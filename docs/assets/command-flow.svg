<svg xmlns="http://www.w3.org/2000/svg" width="420" height="860" viewBox="0 0 420 860" role="img" aria-labelledby="title desc">
  <title id="title">iPhonedex remote command flow screenshot</title>
  <desc id="desc">A safe illustrative screenshot of sending a remote command from the iPhone app to Mac Codex.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f1e9"/>
      <stop offset="0.5" stop-color="#eef5f1"/>
      <stop offset="1" stop-color="#f4f0f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#24302d" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="420" height="860" fill="#d8ded8"/>
  <rect x="33" y="24" width="354" height="812" rx="48" fill="#101614" filter="url(#shadow)"/>
  <rect x="45" y="38" width="330" height="784" rx="39" fill="url(#bg)"/>
  <rect x="165" y="52" width="90" height="8" rx="4" fill="#101614" opacity="0.45"/>

  <g transform="translate(65 82)">
    <circle cx="18" cy="20" r="18" fill="#ffffff" stroke="#d7ded8"/>
    <text x="18" y="26" text-anchor="middle" font-family="SF Pro Display, Inter, Arial, sans-serif" font-size="18" fill="#16201c">‹</text>
    <text x="48" y="17" font-family="SF Pro Display, Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16201c">远程指令</text>
    <text x="48" y="37" font-family="SF Pro Display, Inter, Arial, sans-serif" font-size="11" fill="#607069">iPhone → Server → Mac bridge</text>
  </g>

  <g transform="translate(65 142)">
    <rect width="290" height="98" rx="18" fill="#ffffff" fill-opacity="0.80" stroke="#d7ded8"/>
    <text x="18" y="30" font-family="SF Pro Display, Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16201c">发送到 Mac Codex</text>
    <text x="18" y="54" font-family="SF Pro Display, Inter, Arial, sans-serif" font-size="12" fill="#607069">指令先进入 server 队列，再由本机 bridge 拉取。</text>
    <rect x="18" y="70" width="84" height="18" rx="9" fill="#eef5ef"/>
    <text x="60" y="83" text-anchor="middle" font-family="SF Mono, Menlo, monospace" font-size="9" fill="#2c7444">queued</text>
  </g>

  <g transform="translate(75 280)">
    <circle cx="38" cy="38" r="34" fill="#16201c"/>
    <text x="38" y="45" text-anchor="middle" font-family="SF Pro Display, Inter, Arial, sans-serif" font-size="22" fill="#fffaf2">📱</text>
    <text x="38" y="94" text-anchor="middle" font-family="SF Pro Display, Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#16201c">iPhone</text>
    <text x="38" y="112" text-anchor="middle" font-family="SF Mono, Menlo, monospace" font-size="10" fill="#607069">/api/commands</text>

    <path d="M86 38 H146" stroke="#8a9690" stroke-width="2" stroke-linecap="round"/>
    <path d="M138 30 L146 38 L138 46" fill="none" stroke="#8a9690" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <circle cx="190" cy="38" r="34" fill="#ffffff" stroke="#d7ded8"/>
    <text x="190" y="45" text-anchor="middle" font-family="SF Pro Display, Inter, Arial, sans-serif" font-size="22">☁</text>
    <text x="190" y="94" text-anchor="middle" font-family="SF Pro Display, Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#16201c">Server</text>
    <text x="190" y="112" text-anchor="middle" font-family="SF Mono, Menlo, monospace" font-size="10" fill="#607069">queue</text>

    <path d="M234 38 H294" stroke="#8a9690" stroke-width="2" stroke-linecap="round"/>
    <path d="M286 30 L294 38 L286 46" fill="none" stroke="#8a9690" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <circle cx="338" cy="38" r="34" fill="#eaf5ed" stroke="#9acaa5"/>
    <text x="338" y="45" text-anchor="middle" font-family="SF Pro Display, Inter, Arial, sans-serif" font-size="22">⌘</text>
    <text x="338" y="94" text-anchor="middle" font-family="SF Pro Display, Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#16201c">Mac</text>
    <text x="338" y="112" text-anchor="middle" font-family="SF Mono, Menlo, monospace" font-size="10" fill="#607069">Codex CLI</text>
  </g>

  <g transform="translate(65 444)">
    <rect width="290" height="74" rx="18" fill="#16201c"/>
    <text x="18" y="28" font-family="SF Pro Display, Inter, Arial, sans-serif" font-size="14" fill="#fffaf2">继续根据最新验证结果收尾。</text>
    <text x="18" y="50" font-family="SF Mono, Menlo, monospace" font-size="11" fill="#cbd7d1">host: macbook · cwd: project path</text>
  </g>

  <g transform="translate(65 552)">
    <rect width="290" height="42" rx="14" fill="#fff7df" stroke="#ead39a"/>
    <circle cx="22" cy="21" r="7" fill="#f0a523"/>
    <text x="42" y="26" font-family="SF Pro Display, Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#8d641d">等待 bridge 拉取命令</text>
  </g>

  <g transform="translate(65 616)">
    <rect width="290" height="42" rx="14" fill="#eef7f0" stroke="#a8d3b0"/>
    <circle cx="22" cy="21" r="7" fill="#2f9e54"/>
    <text x="42" y="26" font-family="SF Pro Display, Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#2f6f43">Mac 已开始执行</text>
  </g>

  <g transform="translate(65 708)">
    <rect width="290" height="90" rx="22" fill="#ffffff" fill-opacity="0.92" stroke="#d7ded8"/>
    <rect x="14" y="14" width="216" height="62" rx="18" fill="#f7faf7" stroke="#d7ded8"/>
    <text x="30" y="38" font-family="SF Pro Display, Inter, Arial, sans-serif" font-size="13" fill="#16201c">请继续执行验证并推送</text>
    <text x="30" y="60" font-family="SF Pro Display, Inter, Arial, sans-serif" font-size="12" fill="#8a9690">输入框会随内容自动增高</text>
    <circle cx="260" cy="45" r="18" fill="#16201c"/>
    <text x="260" y="51" text-anchor="middle" font-family="SF Pro Display, Inter, Arial, sans-serif" font-size="16" fill="#fffaf2">↑</text>
  </g>
</svg>
